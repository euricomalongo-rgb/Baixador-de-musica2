<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DJ Eurico</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
    text-align:center;
}

header{
    padding:40px;
    background:#222;
}

.player{
    width:90%;
    max-width:600px;
    margin:40px auto;
    padding:30px;
    border-radius:20px;
    background:#1d1d1d;
}

button{
    padding:12px 25px;
    margin:10px;
    font-size:18px;
    cursor:pointer;
}

footer{
    margin-top:40px;
    padding:20px;
    background:#222;
}
</style>
</head>

<body>

<header>
    <h1>DJ Eurico</h1>
    <p>Misturas, eventos e música ao vivo</p>
</header>

<div class="player">

    <h2>Leitor de música</h2>

    <audio id="musica" controls>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <br>

    <button onclick="document.getElementById('musica').play()">
        ▶ Tocar
    </button>

    <button onclick="document.getElementById('musica').pause()">
        ⏸ Pausar
    </button>

</div>

<footer>
    <p>Instagram: @djeurico</p>
    <p>Contacto: +244 XXX XXX XXX</p>
</footer>

</body>
</html>
